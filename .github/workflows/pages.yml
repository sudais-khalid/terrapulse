# Publishes the static web app in web/ to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy TerraPulse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check the site has its data
        run: test -f web/data/sites.json && test -f web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
