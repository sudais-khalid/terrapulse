name: Bug report
description: Something in the app or the pipeline does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Web app, Pipeline (Python), Colab notebook, Data or STAC catalog, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For the web app, paste the share link (the chain icon copies the exact view).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python -m terrapulse process --site lower-indus
        2. ...
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: Browser and device, or OS and Python version
