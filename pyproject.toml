[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terrapulse"
dynamic = ["version"]
description = "NISAR L-band radar time series to web-ready surface change layers: open water, flooded vegetation, change and seasonal rhythm."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Sudais Khalid" },
  { name = "Sunnia Aslam" },
]
keywords = ["NISAR", "SAR", "L-band", "remote sensing", "flood mapping", "wetlands", "change detection", "GCOV", "NASA Space Apps"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
  "asf_search>=8.0",
  "fsspec>=2024.6",
  "aiohttp>=3.9",
  "requests>=2.31",
  "h5py>=3.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pystac[validation]>=1.10"]

[project.scripts]
terrapulse = "terrapulse.__main__:main"

[project.urls]
Homepage = "https://sudais-khalid.github.io/terrapulse/"
Source = "https://github.com/sudais-khalid/terrapulse"
Issues = "https://github.com/sudais-khalid/terrapulse/issues"
Changelog = "https://github.com/sudais-khalid/terrapulse/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["terrapulse"]

[tool.setuptools.dynamic]
version = { attr = "terrapulse.__version__" }

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are kept where they read better (tables, URLs, prose)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
